name: Build Onda VST3
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Optional {0} tests — {1} — {2}', inputs.tests, inputs.tag, inputs.platform) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to test (for example, 0.1.30)
        required: true
        type: string
      tests:
        description: Optional tests (all includes three extra Linux channel builds)
        type: choice
        default: browser-audit
        options:
          - browser-audit
          - browser
          - audit
          - extended
          - channels
          - all
      platform:
        description: Platform (browser, audit and channels require linux-x64)
        type: choice
        default: linux-x64
        options:
          - linux-x64
          - windows-x64
          - macos-arm64
          - all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.tag || github.ref }}-${{ inputs.tests || 'release' }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux-x64' && 'ubuntu-24.04' || matrix.platform == 'windows-x64' && 'windows-latest' || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'push' || inputs.platform == 'all') && '["linux-x64","windows-x64","macos-arm64"]' || format('["{0}"]', inputs.platform)) }}

    env:
      BUILD_PATH: ${{ github.workspace }}/build

    steps:
      - name: Select tests
        id: tests
        shell: bash
        env:
          TEST_SELECTION: ${{ github.event_name == 'push' && 'release' || inputs.tests }}
          TARGET_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          TARGET_PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
        run: |
          if [[ ! "$TARGET_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected an existing version tag, got $TARGET_TAG" >&2
            exit 1
          fi
          case "$TARGET_PLATFORM" in
            linux-x64|windows-x64|macos-arm64|all) ;;
            *) echo "unknown platform: $TARGET_PLATFORM" >&2; exit 1 ;;
          esac

          browser=false
          audit=false
          extended=false
          channels=false
          build=false
          validator=false
          labels=''
          targets=()
          case "$TEST_SELECTION" in
            release) labels='core|native'; build=true; validator=true ;;
            browser-audit) browser=true; audit=true ;;
            browser) browser=true ;;
            audit) audit=true ;;
            extended) extended=true ;;
            channels) channels=true ;;
            all) browser=true; audit=true; extended=true; channels=true ;;
            *) echo "unknown test selection: $TEST_SELECTION" >&2; exit 1 ;;
          esac

          if [[ "$TEST_SELECTION" != release ]]; then
            if [[ "$TARGET_PLATFORM" != linux-x64 && "$TEST_SELECTION" != extended && "$TEST_SELECTION" != all ]]; then
              echo "$TEST_SELECTION requires platform linux-x64; use extended or all for other platforms" >&2
              exit 1
            fi
            if [[ "$RUNNER_OS" != Linux ]]; then
              browser=false
              audit=false
              channels=false
            fi
            if [[ "$browser" == true ]]; then labels+='browser|'; fi
            if [[ "$audit" == true ]]; then
              labels+='audit|'
              targets+=(onda_vst3_realtime_audit_tests onda_vst3_smoke)
            fi
            if [[ "$extended" == true ]]; then
              labels+='extended|'
              targets+=(onda_plugin_tests onda_processor_tests)
            fi
            labels="${labels%|}"
            validator="$channels"
            if [[ "${#targets[@]}" -gt 0 ]]; then build=true; fi
          fi
          if [[ -n "$labels" ]]; then labels="^($labels)$"; fi
          printf '%s\n' "tag=$TARGET_TAG" "browser=$browser" "audit=$audit" \
            "channels=$channels" "build=$build" "validator=$validator" \
            "labels=$labels" "targets=${targets[*]}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Read and validate version
        id: version
        shell: bash
        env:
          TARGET_TAG: ${{ steps.tests.outputs.tag }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          version="$(tr -d '\r\n' < plugin-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid plugin version: $version" >&2
            exit 1
          fi

          tag_version="${TARGET_TAG#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "tag $TARGET_TAG does not match plugin-version $version" >&2
            exit 1
          fi

          package_name="Onda-VST3-$version-$PACKAGE_PLATFORM"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pkg-config xvfb xauth \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Checkout VST3 validator SDK
        if: steps.tests.outputs.validator == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: steinbergmedia/vst3sdk
          ref: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0 # v3.8.0_build_66
          path: build-validator-sdk
          persist-credentials: false

      - name: Build VST3 validator
        if: steps.tests.outputs.validator == 'true'
        shell: bash
        run: |
          git -C build-validator-sdk submodule update --init --depth 1 \
            base cmake pluginterfaces public.sdk
          cmake -S build-validator-sdk -B build-validator \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          cmake --build build-validator --config Release --target validator --parallel 2
          validator="$GITHUB_WORKSPACE/build-validator/bin/Release/validator"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            validator="$validator.exe"
          fi
          test -f "$validator"
          echo "ONDA_VST3_VALIDATOR=$validator" >> "$GITHUB_ENV"

      - name: Set up browser test tooling
        if: steps.tests.outputs.browser == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install controlled browser
        if: steps.tests.outputs.browser == 'true'
        shell: bash
        run: |
          npm ci --prefix tests
          npm exec --prefix tests -- playwright install --with-deps chromium --only-shell

      - name: Configure CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $webView2 = Join-Path $env:RUNNER_TEMP "webview2"
          nuget install Microsoft.Web.WebView2 `
            -Version 1.0.3485.44 `
            -OutputDirectory $webView2 `
            -NonInteractive
          cmake -S . -B $env:BUILD_PATH -A x64 `
            "-DONDA_VST3_VALIDATOR=$env:ONDA_VST3_VALIDATOR" `
            "-DONDA_PLUGIN_BUILD_BROWSER_TESTS=OFF" `
            "-DONDA_PLUGIN_BUILD_VST3_AUDIT=OFF" `
            "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$webView2"

      - name: Configure CMake on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >
          cmake -S . -B "$BUILD_PATH"
          -DCMAKE_BUILD_TYPE=Release
          -DONDA_VST3_VALIDATOR="${ONDA_VST3_VALIDATOR:-}"
          -DONDA_PLUGIN_BUILD_BROWSER_TESTS=${{ steps.tests.outputs.browser == 'true' && 'ON' || 'OFF' }}
          -DONDA_PLUGIN_BUILD_VST3_AUDIT=${{ steps.tests.outputs.audit == 'true' && 'ON' || 'OFF' }}

      - name: Build
        if: steps.tests.outputs.build == 'true'
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          BUILD_TARGETS: ${{ steps.tests.outputs.targets }}
        run: |
          read -r -a targets <<< "$BUILD_TARGETS"
          build_args=()
          if [[ "${#targets[@]}" -gt 0 ]]; then build_args=(--target "${targets[@]}"); fi
          cmake --build "$BUILD_PATH" --config Release "${build_args[@]}"

      - name: Test selected groups
        if: steps.tests.outputs.labels != ''
        shell: bash
        env:
          TEST_LABELS: ${{ steps.tests.outputs.labels }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ctest --test-dir "$BUILD_PATH" -C Release \
              --output-on-failure --no-tests=error -L "$TEST_LABELS"
          else
            ctest --test-dir "$BUILD_PATH" -C Release \
              --output-on-failure --no-tests=error -L "$TEST_LABELS"
          fi

      - name: Test channel layouts
        if: steps.tests.outputs.channels == 'true'
        shell: bash
        run: xvfb-run -a bash scripts/check-channel-layouts.sh "$BUILD_PATH"

      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-failure-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/
            build/test-artifacts/
            build-layout-*/Testing/Temporary/
            build/Release/onda_plugin_tests.exe
            build/Release/onda_processor_tests.exe
            build/Release/*.pdb
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify macOS deployment targets
        if: github.event_name == 'push' && runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/check-macos-deployment-target.sh \
            "$MACOSX_DEPLOYMENT_TARGET" \
            "$BUILD_PATH/OndaSynth_artefacts/Release/VST3/OndaSynth.vst3/Contents/MacOS/OndaSynth" \
            "$BUILD_PATH/OndaFX_artefacts/Release/VST3/OndaFX.vst3/Contents/MacOS/OndaFX"

      - name: Package Unix bundles
        if: github.event_name == 'push' && runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
        run: |
          package_root="$RUNNER_TEMP/$PACKAGE_NAME"
          archive="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME.zip"
          mkdir -p "$package_root" "$(dirname "$archive")"
          cp -R "$BUILD_PATH/OndaSynth_artefacts/Release/VST3/OndaSynth.vst3" "$package_root/"
          cp -R "$BUILD_PATH/OndaFX_artefacts/Release/VST3/OndaFX.vst3" "$package_root/"
          cp -R examples "$package_root/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$package_root/"
          cp -R "$BUILD_PATH/release-licenses" "$package_root/licenses"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            find "$package_root" -type f -name '*.so' -exec strip --strip-unneeded {} +
            binary_directory="x86_64-linux"
            binary_suffix=".so"
          else
            binary_directory="MacOS"
            binary_suffix=""
          fi
          "$BUILD_PATH/onda_vst3_smoke" \
            "$package_root/OndaSynth.vst3/Contents/$binary_directory/OndaSynth$binary_suffix" \
            "$package_root/OndaFX.vst3/Contents/$binary_directory/OndaFX$binary_suffix"
          for bundle in "$package_root"/*.vst3; do
            "$ONDA_VST3_VALIDATOR" -q "$bundle"
          done
          cd "$RUNNER_TEMP"
          cmake -E tar cf "$archive" --format=zip "$PACKAGE_NAME"

      - name: Package Windows bundles
        if: github.event_name == 'push' && runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          $archive = Join-Path $distDir ($env:PACKAGE_NAME + ".zip")

          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -Recurse -Force `
            (Join-Path $env:BUILD_PATH "OndaSynth_artefacts\Release\VST3\OndaSynth.vst3") `
            $packageRoot
          Copy-Item -Recurse -Force `
            (Join-Path $env:BUILD_PATH "OndaFX_artefacts\Release\VST3\OndaFX.vst3") `
            $packageRoot
          Copy-Item -Recurse -Force `
            (Join-Path $env:GITHUB_WORKSPACE "examples") `
            $packageRoot
          Copy-Item README.md $packageRoot
          Copy-Item LICENSE $packageRoot
          Copy-Item THIRD_PARTY_NOTICES.md $packageRoot
          Copy-Item -Recurse -Force `
            (Join-Path $env:BUILD_PATH "release-licenses") `
            (Join-Path $packageRoot "licenses")
          & (Join-Path $env:BUILD_PATH "Release/onda_vst3_smoke.exe") `
            (Join-Path $packageRoot "OndaSynth.vst3/Contents/x86_64-win/OndaSynth.vst3") `
            (Join-Path $packageRoot "OndaFX.vst3/Contents/x86_64-win/OndaFX.vst3")
          if ($LASTEXITCODE -ne 0) { throw "Packaged VST3 smoke test failed" }
          foreach ($bundle in Get-ChildItem $packageRoot -Filter *.vst3) {
            & $env:ONDA_VST3_VALIDATOR -q $bundle.FullName
            if ($LASTEXITCODE -ne 0) { throw "Packaged VST3 validation failed" }
          }
          Compress-Archive -Path $packageRoot -DestinationPath $archive -Force

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: dist/${{ steps.version.outputs.package_name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < plugin-version)"
          release_tag="$GITHUB_REF_NAME"
          tag_version="${release_tag#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$tag_version" != "$version" ]]; then
            echo "release ref $release_tag does not match plugin-version $version" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$release_tag^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "tag $release_tag resolves to $tag_commit, not workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Onda-VST3-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mapfile -t release_files < <(find dist -maxdepth 1 -type f \
            \( -name '*.zip' -o -name 'SHA256SUMS.txt' \) -print | sort)
          if [[ "${#release_files[@]}" -ne 4 ]]; then
            echo "expected three archives and SHA256SUMS.txt" >&2
            printf '%s\n' "${release_files[@]}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; published releases are immutable" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${release_files[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
