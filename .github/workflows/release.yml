name: Build Onda VST3

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MACOSX_DEPLOYMENT_TARGET: "11.0"

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: windows-x64
            runner: windows-latest
          - name: macos-arm64
            runner: macos-latest

    env:
      BUILD_PATH: ${{ github.workspace }}/build

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < plugin-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid plugin version: $version" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match plugin-version $version" >&2
              exit 1
            fi
          fi

          package_name="Onda-VST3-$version-${{ matrix.name }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Checkout VST3 validator SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: steinbergmedia/vst3sdk
          ref: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0 # v3.8.0_build_66
          path: build-validator-sdk
          persist-credentials: false

      - name: Build VST3 validator
        shell: bash
        run: |
          git -C build-validator-sdk submodule update --init --depth 1 \
            base cmake pluginterfaces public.sdk
          cmake -S build-validator-sdk -B build-validator \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          cmake --build build-validator --config Release --target validator --parallel 2
          validator="$GITHUB_WORKSPACE/build-validator/bin/Release/validator"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            validator="$validator.exe"
          fi
          test -f "$validator"
          echo "ONDA_VST3_VALIDATOR=$validator" >> "$GITHUB_ENV"

      - name: Configure CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $webView2 = Join-Path $env:RUNNER_TEMP "webview2"
          nuget install Microsoft.Web.WebView2 `
            -Version 1.0.3485.44 `
            -OutputDirectory $webView2 `
            -NonInteractive
          cmake -S . -B $env:BUILD_PATH -A x64 `
            "-DONDA_VST3_VALIDATOR=$env:ONDA_VST3_VALIDATOR" `
            "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$webView2"

      - name: Configure CMake on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >
          cmake -S . -B "$BUILD_PATH"
          -DCMAKE_BUILD_TYPE=Release
          -DONDA_VST3_VALIDATOR="$ONDA_VST3_VALIDATOR"

      - name: Build
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: cmake --build "$BUILD_PATH" --config Release

      - name: Test
        shell: bash
        run: ctest --test-dir "$BUILD_PATH" -C Release --output-on-failure

      - name: Verify macOS deployment targets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/check-macos-deployment-target.sh \
            "$MACOSX_DEPLOYMENT_TARGET" \
            "$BUILD_PATH/OndaSynth_artefacts/Release/VST3/OndaSynth.vst3/Contents/MacOS/OndaSynth" \
            "$BUILD_PATH/OndaFX_artefacts/Release/VST3/OndaFX.vst3/Contents/MacOS/OndaFX"

      - name: Test zero-input VST3 configuration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          onda_version="$(tr -d '\r\n' < onda-version)"
          zero_input_build="$RUNNER_TEMP/onda-zero-input"
          cmake -S . -B "$zero_input_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DONDA_PLUGIN_INPUT_CHANNELS=0 \
            -DONDA_VST3_VALIDATOR="$ONDA_VST3_VALIDATOR" \
            -DONDA_SDK_ARCHIVE="$BUILD_PATH/_deps/onda-$onda_version-linux-x64.tar.xz" \
            -DONDA_SDK_CHECKSUMS="$BUILD_PATH/_deps/$onda_version-SHA256SUMS.txt" \
            -DONDA_RELEASE_SOURCE_DIR="$BUILD_PATH/_deps/ondareleasesource-src" \
            -DONDA_JUCE_ROOT="$BUILD_PATH/_deps/juce-src"
          cmake --build "$zero_input_build" --config Release \
            --target onda_vst3_smoke --parallel 2
          ctest --test-dir "$zero_input_build" -C Release \
            --output-on-failure -R onda_vst3_

      - name: Package Unix bundles
        if: runner.os != 'Windows'
        id: package_unix
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
        run: |
          package_root="$RUNNER_TEMP/$PACKAGE_NAME"
          archive="$GITHUB_WORKSPACE/dist/$PACKAGE_NAME.zip"
          mkdir -p "$package_root" "$(dirname "$archive")"
          cp -R "$BUILD_PATH/OndaSynth_artefacts/Release/VST3/OndaSynth.vst3" "$package_root/"
          cp -R "$BUILD_PATH/OndaFX_artefacts/Release/VST3/OndaFX.vst3" "$package_root/"
          cp -R examples "$package_root/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$package_root/"
          cp -R "$BUILD_PATH/release-licenses" "$package_root/licenses"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            find "$package_root" -type f -name '*.so' -exec strip --strip-unneeded {} +
            "$BUILD_PATH/onda_vst3_smoke" \
              "$package_root/OndaSynth.vst3/Contents/x86_64-linux/OndaSynth.so" \
              "$package_root/OndaFX.vst3/Contents/x86_64-linux/OndaFX.so"
            for bundle in "$package_root"/*.vst3; do
              "$ONDA_VST3_VALIDATOR" -q "$bundle"
            done
          fi
          cd "$RUNNER_TEMP"
          cmake -E tar cf "$archive" --format=zip "$PACKAGE_NAME"

      - name: Package Windows bundles
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          $archive = Join-Path $distDir ($env:PACKAGE_NAME + ".zip")

          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -Recurse -Force `
            (Join-Path $env:BUILD_PATH "OndaSynth_artefacts\Release\VST3\OndaSynth.vst3") `
            $packageRoot
          Copy-Item -Recurse -Force `
            (Join-Path $env:BUILD_PATH "OndaFX_artefacts\Release\VST3\OndaFX.vst3") `
            $packageRoot
          Copy-Item -Recurse -Force `
            (Join-Path $env:GITHUB_WORKSPACE "examples") `
            $packageRoot
          Copy-Item README.md $packageRoot
          Copy-Item LICENSE $packageRoot
          Copy-Item THIRD_PARTY_NOTICES.md $packageRoot
          Copy-Item -Recurse -Force `
            (Join-Path $env:BUILD_PATH "release-licenses") `
            (Join-Path $packageRoot "licenses")
          Compress-Archive -Path $packageRoot -DestinationPath $archive -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: dist/${{ steps.version.outputs.package_name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < plugin-version)"
          release_tag="$GITHUB_REF_NAME"
          tag_version="${release_tag#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$tag_version" != "$version" ]]; then
            echo "release ref $release_tag does not match plugin-version $version" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$release_tag^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "tag $release_tag resolves to $tag_commit, not workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Onda-VST3-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mapfile -t release_files < <(find dist -maxdepth 1 -type f \
            \( -name '*.zip' -o -name 'SHA256SUMS.txt' \) -print | sort)
          if [[ "${#release_files[@]}" -ne 4 ]]; then
            echo "expected three archives and SHA256SUMS.txt" >&2
            printf '%s\n' "${release_files[@]}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; published releases are immutable" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${release_files[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
