name: Build Onda VST3
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Optional {0} tests — {1} — {2}', inputs.tests, inputs.source_ref, inputs.platform) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source tag, branch, or full commit SHA to test
        required: true
        type: string
        default: main
      tests:
        description: package builds release artifacts; all runs optional tests including four Linux layouts
        type: choice
        default: audit
        options:
          - package
          - audit
          - extended
          - channels
          - all
      platform:
        description: Platform (audit and channels require linux-x64)
        type: choice
        default: linux-x64
        options:
          - linux-x64
          - windows-x64
          - macos-arm64
          - all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.source_ref || github.ref }}-${{ inputs.tests || 'release' }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
      tests: ${{ github.event_name == 'push' && 'package' || inputs.tests }}
      platform: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
      release_tag: ${{ github.event_name == 'push' && github.ref_name || '' }}

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < plugin-version)"
          release_tag="$GITHUB_REF_NAME"
          tag_version="${release_tag#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$tag_version" != "$version" ]]; then
            echo "release ref $release_tag does not match plugin-version $version" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$release_tag^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "tag $release_tag resolves to $tag_commit, not workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Onda-VST3-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mapfile -t release_files < <(find dist -maxdepth 1 -type f \
            \( -name '*.zip' -o -name 'SHA256SUMS.txt' \) -print | sort)
          if [[ "${#release_files[@]}" -ne 4 ]]; then
            echo "expected three archives and SHA256SUMS.txt" >&2
            printf '%s\n' "${release_files[@]}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; published releases are immutable" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${release_files[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
