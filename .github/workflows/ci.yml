name: Test Onda

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Run extended regressions and custom channel layouts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/build.yml
    with:
      extended: ${{ inputs.extended == true }}
